<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>404 - 页面不存在</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green:      #3ecb6f;
      --green-dark: #2db85e;
      --green-light: #e8f9ef;
      --text-main:  #222222;
      --text-gray:  #999999;
      --bg:         #f5f5f5;
      --white:      #ffffff;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--text-main);
    }

    /* 顶部导航栏 */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .topbar-back {
      position: absolute;
      left: 14px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .topbar-back svg {
      width: 22px;
      height: 22px;
      color: var(--white);
    }

    .topbar-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 1px;
    }

    /* 内容区 */
    .page {
      padding-top: 50px;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px 60px;
      width: 100%;
      max-width: 480px;
    }

    /* 404 图形 */
    .icon-wrap {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--green-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .icon-wrap svg {
      width: 70px;
      height: 70px;
      color: var(--green);
    }

    .error-code {
      font-size: 64px;
      font-weight: 800;
      color: var(--green);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 10px;
      text-align: center;
    }

    .error-desc {
      font-size: 14px;
      color: var(--text-gray);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    /* 按钮组 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 48px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
      text-decoration: none;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-primary {
      background: var(--green);
      color: var(--white);
    }

    .btn-outline {
      background: var(--white);
      color: var(--green);
      border: 2px solid var(--green);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <div class="topbar">
    <div class="topbar-back" onclick="history.back()" title="返回上一页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <span class="topbar-title">页面不存在</span>
  </div>

  <div class="page">
    <div class="content">

      <!-- 图标 -->
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>

      <div class="error-code">404</div>
      <div class="error-title">页面不见了</div>
      <div class="error-desc">
        您访问的页面可能已被删除、<br>
        移动或暂时不可用
      </div>

      <!-- 操作按钮 -->
      <div class="btn-group">
        <button class="btn btn-primary" onclick="history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          返回上一页
        </button>
        <a class="btn btn-outline" href="/index.php">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          返回首页
        </a>
      </div>

    </div>
  </div>

</body>
</html>
