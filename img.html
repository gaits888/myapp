<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图片查看器演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            padding: 15px;
        }
        .page-title {
            text-align: center;
            padding: 20px 0;
            color: #333;
            font-size: 18px;
        }
        .img-list {
            max-width: 600px;
            margin: 0 auto;
        }
        .img-list > div {
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .img-list img {
            display: block;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .img-list img:hover {
            opacity: 0.9;
        }
        .tip {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 20px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <h1 class="page-title">点击图片查看大图</h1>
    
    <div class="img-list">
        <div style='width:100%;margin-top:10px;'>
            <img style='display:block;width:100%;' 
                 src='data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==' 
                 data-original='https://img.jing-zhao.com/ltpics/20260601/20260601232552_v99f3vkb.jpeg' 
                 onerror="this.onerror=null;" 
                 class='lazy'>
        </div>
        <div style='width:100%;margin-top:10px;'>
            <img style='display:block;width:100%;' 
                 src='data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==' 
                 data-original='https://img.jing-zhao.com/ltpics/20260601/20260601232552_e2mf72qd.jpeg' 
                 onerror="this.onerror=null;" 
                 class='lazy'>
        </div>
        <div style='width:100%;margin-top:10px;'>
            <img style='display:block;width:100%;' 
                 src='data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==' 
                 data-original='https://picsum.photos/800/600?random=1' 
                 onerror="this.onerror=null;" 
                 class='lazy'>
        </div>
        <div style='width:100%;margin-top:10px;'>
            <img style='display:block;width:100%;' 
                 src='data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==' 
                 data-original='https://picsum.photos/800/600?random=2' 
                 onerror="this.onerror=null;" 
                 class='lazy'>
        </div>
        <div style='width:100%;margin-top:10px;'>
            <img style='display:block;width:100%;' 
                 src='data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==' 
                 data-original='https://picsum.photos/800/600?random=3' 
                 onerror="this.onerror=null;" 
                 class='lazy'>
        </div>
    </div>
    
    <p class="tip">
        PC端：点击左右箭头或键盘方向键切换，ESC关闭<br>
        移动端：左右滑动切换图片，点击关闭
    </p>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/imgviewer.js"></script>
    <script>
        // 懒加载图片：将 data-original 的值赋给 src
        $(function() {
            $('.lazy').each(function() {
                var $img = $(this);
                var originalSrc = $img.attr('data-original');
                if (originalSrc) {
                    $img.attr('src', originalSrc);
                }
            });
        });
    </script>
</body>
</html>
